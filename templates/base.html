<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Poliscopic Meetings{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        @font-face {
            font-family: 'Microgramma';
            src: url('/static/fonts/microgramma.woff2') format('woff2'),
                 url('/static/fonts/microgramma.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Microgramma';
            src: url('/static/fonts/microgramma-bold.woff2') format('woff2'),
                 url('/static/fonts/microgramma-bold.woff') format('woff');
            font-weight: 700;
            font-style: normal;
        }
        .navbar-brand {
            font-family: 'Microgramma', 'Eurostile', 'Arial', sans-serif;
            font-weight: 400;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Poliscopic</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/meetings">Meetings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/bodies">Members</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/permits">Permits</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="container text-center text-muted small py-3">
        <!-- Debug link removed for production -->
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/table-controls.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
