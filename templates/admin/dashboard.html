{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<div class="container-fluid mt-3">
  <h1>Admin Dashboard</h1>

  <div class="row mt-4">
    <div class="col-sm-6 col-lg-3 mb-3">
      <a href="/admin/drafts" class="text-decoration-none">
        <div class="card border-primary">
          <div class="card-body text-center">
            <h2 class="text-primary mb-0">{{ drafts_count }}</h2>
            <small class="text-muted">Drafts</small>
          </div>
        </div>
      </a>
    </div>
    <div class="col-sm-6 col-lg-3 mb-3">
      <a href="/admin/published" class="text-decoration-none">
        <div class="card border-success">
          <div class="card-body text-center">
            <h2 class="text-success mb-0">{{ published_count }}</h2>
            <small class="text-muted">Published</small>
          </div>
        </div>
      </a>
    </div>
    <div class="col-sm-6 col-lg-3 mb-3">
      <a href="/admin/archived" class="text-decoration-none">
        <div class="card border-secondary">
          <div class="card-body text-center">
            <h2 class="text-secondary mb-0">{{ archived_count }}</h2>
            <small class="text-muted">Archived</small>
          </div>
        </div>
      </a>
    </div>
    <div class="col-sm-6 col-lg-3 mb-3">
      <a href="/admin/bluesky" class="text-decoration-none">
        <div class="card border-info">
          <div class="card-body text-center">
            <h2 class="text-info mb-0">{{ skeet_count }}</h2>
            <small class="text-muted">Bluesky Drafts</small>
          </div>
        </div>
      </a>
    </div>
  </div>

  <div class="mt-2">
    <a href="/admin/drafts" class="btn btn-primary me-2">Manage Articles →</a>
    <a href="/admin/bluesky" class="btn btn-outline-info me-2">Review Bluesky Drafts →</a>
    <a href="/admin/articles/new" class="btn btn-outline-success">New Article</a>
  </div>
</div>
{% endblock %}
