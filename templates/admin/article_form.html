{% extends "base.html" %}
{% block title %}{% if article %}Edit: {{ article.title }}{% else %}New Article{% endif %} — Poliscopic{% endblock %}
{% block content %}
<h1>{% if article %}Edit Article{% else %}New Article{% endif %}</h1>

<form method="POST" class="mt-3">
  <div class="row">
    <div class="col-md-8">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ article.title if article else '' }}" required>
      </div>

      <div class="mb-3">
        <label for="summary" class="form-label">Summary</label>
        <textarea class="form-control" id="summary" name="summary" rows="3">{{ article.summary if article else '' }}</textarea>
      </div>

      <div class="mb-3">
        <label for="body" class="form-label">Body (Markdown)</label>
        <textarea class="form-control" id="body" name="body" rows="15">{{ article.body if article else '' }}</textarea>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card mb-3">
        <div class="card-body">
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
              <option value="draft" {% if article and article.status == 'draft' %}selected{% endif %}>Draft</option>
              <option value="published" {% if article and article.status == 'published' %}selected{% endif %}>Published</option>
              <option value="archived" {% if article and article.status == 'archived' %}selected{% endif %}>Archived</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Tags</label>
            <div style="max-height:200px;overflow-y:auto">
              {% for tag in tags %}
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="tags" value="{{ tag.id }}"
                  id="tag-{{ tag.id }}"
                  {% if tag.id|string in preselected_tags %}checked{% endif %}>
                <label class="form-check-label" for="tag-{{ tag.id }}">{{ tag.name }}</label>
              </div>
              {% endfor %}
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Sources</label>
            <div id="source-list">
              <div class="source-entry mb-2 p-2 border rounded">
                <input type="text" class="form-control form-control-sm mb-1" name="source_body[]" placeholder="Body code (e.g. bos)" value="{{ source_body or '' }}">
                <input type="text" class="form-control form-control-sm mb-1" name="source_meeting_id[]" placeholder="Meeting ID" value="{{ source_meeting or '' }}">
                <input type="text" class="form-control form-control-sm mb-1" name="source_item_number[]" placeholder="Item number" value="{{ source_item or '' }}">
                <input type="url" class="form-control form-control-sm" name="source_url[]" placeholder="Source URL" value="{{ source_url or '' }}">
              </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addSource()">+ Add source</button>
          </div>

          <button type="submit" class="btn btn-primary w-100">{% if article %}Update{% else %}Create{% endif %}</button>
        </div>
      </div>
    </div>
  </div>
</form>

<script>
function addSource() {
  var list = document.getElementById('source-list');
  var entry = document.createElement('div');
  entry.className = 'source-entry mb-2 p-2 border rounded';
  entry.innerHTML = `
    <input type="text" class="form-control form-control-sm mb-1" name="source_body[]" placeholder="Body code (e.g. bos)">
    <input type="text" class="form-control form-control-sm mb-1" name="source_meeting_id[]" placeholder="Meeting ID">
    <input type="text" class="form-control form-control-sm mb-1" name="source_item_number[]" placeholder="Item number">
    <input type="url" class="form-control form-control-sm" name="source_url[]" placeholder="Source URL">
  `;
  list.appendChild(entry);
}
</script>
{% endblock %}
