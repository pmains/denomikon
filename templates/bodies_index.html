{% extends "base.html" %}
{% block title %}Public Bodies — Poliscopic Meetings{% endblock %}
{% block content %}
<h1 class="mb-3">Public Bodies</h1>

<div class="mb-4">
  <select id="jurisdiction-filter" class="form-select" style="max-width:400px">
    <option value="">All jurisdictions</option>
    {% for j in all_jurisdictions %}
    <option value="{{ j.slug }}">{{ j.name }}</option>
    {% endfor %}
  </select>
</div>

<div id="body-list" class="list-group shadow-sm">
  {% for jurisdiction, bodies in jurisdictions %}
    {% for b in bodies %}
    <a href="/bodies/{{ b.slug }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center body-item" data-jurisdiction="{{ jurisdiction.slug }}">
      <div>
        <strong>{{ b.name }}</strong>
      </div>
      <span class="text-muted small">{{ b.body_code }}</span>
    </a>
    {% endfor %}
  {% endfor %}
</div>

<p class="text-muted small mt-4"><a href="/members">&larr; All members</a></p>

<script>
document.getElementById('jurisdiction-filter').onchange = function() {
  var slug = this.value;
  var items = document.getElementsByClassName('body-item');
  for (var i = 0; i < items.length; i++) {
    items[i].style.display = (!slug || items[i].getAttribute('data-jurisdiction') === slug) ? '' : 'none';
  }
};
</script>
{% endblock %}
