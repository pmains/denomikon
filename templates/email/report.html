<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;padding:0;background:#f4f4f4}
  .container{max-width:600px;margin:0 auto;padding:20px}
  .header{background:#1a365d;color:white;padding:20px;text-align:center;border-radius:8px 8px 0 0}
  .header img{max-height:50px;margin-bottom:10px}
  .header h1{margin:0;font-size:18px;font-weight:600}
  .card{background:white;padding:20px;border-radius:0 0 8px 8px;line-height:1.6}
  .card h2{color:#1a365d;font-size:16px;margin-top:24px;border-bottom:1px solid #e2e8f0;padding-bottom:8px}
  .card h3{color:#2d3748;font-size:14px;margin:16px 0 8px}
  .card a{color:#2b6cb0}
  .card ul{padding-left:20px}
  .card li{margin-bottom:8px}
  .footer{text-align:center;color:#718096;font-size:12px;margin-top:20px}
</style>
</head><body>
<div class="container">
  <div class="header">
    <img src="{{ logo_url }}" alt="Poliscopic">
    <h1>Poliscopic — Weekly Report</h1>
  </div>
  <div class="card">{{ body_html }}</div>
  <div class="footer">
    <p>Poliscopic — Public meeting data for Maricopa County, Arizona</p>
    <p><a href="{{ base_url }}">{{ base_url }}</a></p>
  </div>
</div></body></html>
